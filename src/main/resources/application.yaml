spring:
  application:
    name: auth-service
  jpa:
    hibernate:
      ddl-auto: validate
      show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:10}
          max-idle: ${REDIS_POOL_MAX_IDLE:5}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}
          max-wait: ${REDIS_POOL_MAX_WAIT:1000ms}

server:
  port: 8081
  tomcat:
    threads:
      max: ${MAX_THREADS:50}
      min-spare: ${MIN_SPARE_THREADS:5}
    connection-timeout: 10s

app:
  jwt:
    private-key: ${JWT_PRIVATE_KEY}
    public-key: ${JWT_PUBLIC_KEY}
    access-token-expiry-ms: ${JWT_ACCESS_TOKEN_EXPIRY_MS:900000}
  refresh-token:
    expiry-days: 30
  frontend:
    base-url: ${FRONTEND_BASE_URL}
  scheduler:
    cleanup:
      after-days: ${CLEANUP_UNVERIFIED_USERS_AFTER_DAYS:7}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    path: /v3/api-docs
    enabled: ${API_DOCS_ENABLED:false}

redis:
  cache:
    password-reset:
      ttl: 900000
      cooldown:
        ttl: 60000
    email-verification:
      ttl: 900000
      cooldown:
        ttl: 60000

logging:
  level:
    root: INFO

resend:
  url: ${RESEND_URL:https://api.resend.com}
  api-key: ${RESEND_API_KEY}
  from-email: ${RESEND_FROM_EMAIL}
  from-name: ${RESEND_FROM_NAME:TVTrackr}

bloom-filter:
  bit-size: ${BF_BIT_SIZE:9585059}
  hash-count: ${BF_HASH_COUNT:7}

